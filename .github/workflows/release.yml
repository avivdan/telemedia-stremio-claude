# Builds the signed Android TV APK and publishes it as a GitHub Release.
# Trigger: push a tag like v0.3.0
# (Alternative without CI: `npm run tv:release -- 0.3.0` on the machine that
# holds the signing key, then attach the APK to a release by hand.)
#
# The APK contains no Telegram credentials — each user enters their own in
# the app. Only the signing key is needed, as repository secrets:
#   TELEMEDIA_KEYSTORE_BASE64               release keystore, base64
#   TELEMEDIA_KEYSTORE_PASSWORD, TELEMEDIA_KEY_ALIAS, TELEMEDIA_KEY_PASSWORD

name: Release TV app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TELEMEDIA_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KEYSTORE_B64: ${{ secrets.TELEMEDIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TELEMEDIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TELEMEDIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TELEMEDIA_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Addon dependencies and tests
        run: |
          npm install --prefix addon --no-audit --no-fund
          npm test --prefix addon

      - name: nodejs-mobile runtime
        run: node tv-app/scripts/fetch-libnode.mjs

      - name: Stage addon bundle
        run: node tv-app/scripts/bundle-node.mjs

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.TELEMEDIA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: tv-app
        env:
          TELEMEDIA_KEYSTORE: ${{ runner.temp }}/release.jks
          TELEMEDIA_KEYSTORE_PASSWORD: ${{ secrets.TELEMEDIA_KEYSTORE_PASSWORD }}
          TELEMEDIA_KEY_ALIAS: ${{ secrets.TELEMEDIA_KEY_ALIAS }}
          TELEMEDIA_KEY_PASSWORD: ${{ secrets.TELEMEDIA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APK
        run: cp tv-app/app/build/outputs/apk/release/app-release.apk "Telemedia-${{ github.ref_name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: Telemedia-${{ github.ref_name }}.apk
          generate_release_notes: true
